[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-pr-radar"
version = "0.2.0"
description = "Read-only GitHub pull request triage with CI, review signals and Markdown reports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Denis Samatov"}]

[project.scripts]
pr-radar = "pr_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
